services:
  - type: web
    name: edge-advisor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CAP_CATEGORY_SCAN_LIMIT
        value: 5
      - key: SPECULATIVE_SCAN_LIMIT
        value: 5
      - key: SPEC_DAYTRADE_TTL
        value: 120
      - key: CANDLE_RESPONSE_LIMIT
        value: 80
      - key: DAYTRADE_CHART_LIMIT
        value: 20
      # Owner password: SHA-256 of the password, lowercase hex.
      - key: AUTH_TOKEN_HASH
        sync: false
      # Demo password: deliberately public, gates the read-only dashboard.
      - key: DEMO_TOKEN_HASH
        sync: false
      # Postgres (Neon/Supabase) for user accounts. Without it, accounts are
      # disabled — Render's ephemeral disk cannot hold them.
      - key: DATABASE_URL
        sync: false
      # Base URL used to build verification and password-reset links.
      - key: PUBLIC_SITE_URL
        value: https://nanda0210.github.io/edge-advisor
      # SMTP for verification / reset mail. Unset = links are shown in the UI
      # instead of emailed, which is fine for testing but not for real signups.
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SCHWAB_APP_KEY
        sync: false
      - key: SCHWAB_APP_SECRET
        sync: false
      - key: SCHWAB_CALLBACK_URL
        value: https://nanda0210.github.io/edge-advisor/schwab/callback
      - key: SCHWAB_ACCESS_TOKEN
        sync: false
      - key: SCHWAB_REFRESH_TOKEN
        sync: false
      - key: SCHWAB_BASE_URL
        value: https://api.schwabapi.com
